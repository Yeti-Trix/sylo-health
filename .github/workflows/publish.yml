# Publishes to npm via Trusted Publishing (OIDC — no tokens).
# npm side: package Settings -> Trusted publishing -> GitHub Actions ->
#   user Yeti-Trix, repo sylo-health, workflow filename publish.yml.
# Release flow: bump package.json version -> commit -> tag vX.Y.Z -> push tag.
name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:host --if-present
      - run: npm publish
